<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* O degradê fica num bloco de página inteira, não no body: aplicado ao body,
     o fundo é propagado à página com outra área de referência e se repete
     em ladrilho, deixando emendas visíveis no PDF. */
  @page { size: A4; margin: 0; }
  html, body { width: 210mm; height: 297mm; background: #9E0F0D; }
  .page {
    width: 210mm; height: 297mm; position: relative; overflow: hidden;
    font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif;
    background: linear-gradient(160deg, #E02422 0%, #D21A18 42%, #9E0F0D 100%);
    color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; text-align: center;
    padding: 24mm 20mm 16mm;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .deco { position: absolute; border-radius: 50%; border: 1.2px solid rgba(255,255,255,.14); }
  .deco.d1 { width: 420px; height: 420px; top: -160px; right: -140px; }
  .deco.d2 { width: 620px; height: 620px; top: -260px; right: -240px; }
  .deco.d3 { width: 380px; height: 380px; bottom: -170px; left: -150px; }
  .deco.d4 { width: 560px; height: 560px; bottom: -260px; left: -240px; }
  .top { margin-top: 5mm; }
  .logo-wrap {
    width: 52mm; height: 52mm; margin: 0 auto; border-radius: 50%;
    background: #fff; padding: 2.4mm; box-shadow: 0 18px 50px rgba(0,0,0,.30);
  }
  .logo-wrap img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .brand { margin-top: 10mm; font-size: 40pt; font-weight: 700; letter-spacing: 1.5px; }
  .tagline {
    margin-top: 3.5mm; font-size: 11pt; letter-spacing: 4.5px;
    text-transform: uppercase; color: rgba(255,255,255,.85);
  }
  .divider { width: 34mm; height: 1.4mm; border-radius: 2mm; background: rgba(255,255,255,.85); margin: 10mm auto 0; }
  .doc-kicker {
    margin-top: 10mm; font-size: 9pt; letter-spacing: 2.4px;
    text-transform: uppercase; color: rgba(255,255,255,.8); font-weight: 700;
  }
  .doc-title { margin-top: 3mm; font-size: 21pt; font-weight: 700; letter-spacing: .3px; line-height: 1.3; }
  .doc-sub {
    margin: 5mm auto 0; font-size: 10.5pt; line-height: 1.55;
    color: rgba(255,255,255,.88); max-width: 134mm;
  }
  .chips { margin-top: 9mm; display: flex; gap: 3mm; justify-content: center; flex-wrap: wrap; max-width: 150mm; }
  .chip {
    border: 1px solid rgba(255,255,255,.55); border-radius: 20px;
    padding: 1.6mm 4.6mm; font-size: 8.5pt; letter-spacing: .6px;
    text-transform: uppercase; color: #fff;
  }
  .footer { font-size: 9pt; color: rgba(255,255,255,.75); letter-spacing: .5px; line-height: 1.7; }
</style>
<div class="page">
<div class="deco d1"></div><div class="deco d2"></div>
<div class="deco d3"></div><div class="deco d4"></div>
<div class="top">
  <div class="logo-wrap"><img src="{{LOGO}}" alt="AlinhaJá"></div>
  <div class="brand">AlinhaJá</div>
  <div class="tagline">Plataforma Corporativa Unificada</div>
  <div class="divider"></div>
  <div class="doc-kicker">Documento Oficial</div>
  <div class="doc-title">{{TITULO}}</div>
  <div class="doc-sub">{{SUBTITULO}}</div>
  <div class="chips">{{CHIPS}}</div>
</div>
<div class="footer">{{EDICAO}}</div>
</div>
